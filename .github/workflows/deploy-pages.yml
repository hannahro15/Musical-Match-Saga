name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx jest --ci

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only the game itself, not node_modules, tests or config
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html privacy.html accessibility.html manifest.json src styles images _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # The list comes from the repo (git ls-files), not from _site/, so a
      # file that was left out of the copy step above is still checked.
      - name: Check the live site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          missing=0
          while IFS= read -r file; do
            if ! curl --fail --silent --show-error --output /dev/null \
              --retry 5 --retry-delay 10 --retry-all-errors \
              "$base/$file"; then
              echo "::error::Missing from the live site: $file"
              missing=$((missing + 1))
            fi
          done < <(git ls-files | grep -E '^(manifest\.json|[^/]+\.(html|xml|txt)|(src|styles|images)/.+)$')
          if [ "$missing" -gt 0 ]; then
            echo "$missing file(s) missing from the live site"
            exit 1
          fi
